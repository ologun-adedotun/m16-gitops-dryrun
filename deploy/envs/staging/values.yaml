image:
  repository: ghcr.io/ologun-adedotun/m16-gitops-dryrun/maright-app
  tag: v9.9.9
  pullPolicy: IfNotPresent

config:
  APP_NAME: maright-app
  GREETING: Hello from staging
  LOG_LEVEL: INFO
  READY_AFTER_SECONDS: "5"

networkPolicy:
  enabled: true
  allowFromNamespaces:
    - envoy-gateway-system

route:
  enabled: true
  hostnames:
    - staging.mission.local
  gateway:
    name: mission
    namespace: infra
